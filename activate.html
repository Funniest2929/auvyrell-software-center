<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Account Activation | Auvyrell Accounts</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1426;color:#eef5ff;font:16px/1.6 system-ui,sans-serif}main{max-width:520px;margin:70px auto;padding:28px}header{font-weight:700;letter-spacing:.14em;color:#a8d1ff;border-bottom:1px solid #33445d;padding-bottom:18px}h1{line-height:1.2}p{color:#becce0}label{display:block;margin-top:16px}input:not([type=checkbox]),button{width:100%;padding:14px;border-radius:8px;font:inherit;margin-top:8px}input:not([type=checkbox]){background:white;color:#111;border:1px solid #425779}button{background:#2864cc;color:white;border:0;font-weight:700;cursor:pointer;margin-top:20px}button:disabled{opacity:.55;cursor:wait}a{color:#a8d1ff}#status:not(:empty){padding:14px;border:1px solid #425779;border-radius:8px}[hidden]{display:none!important}footer{border-top:1px solid #33445d;margin-top:28px;padding-top:18px;font-size:14px}</style></head><body><main><header>AUVYRELL ACCOUNTS</header><h1>Activate your account</h1><p id="intro">Open the invitation sent by your administrator to create your password.</p><form id="form" hidden><label for="password">New password (at least 12 characters)</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><label><input id="show" type="checkbox"> Show passwords</label><button id="submit">Activate account</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="reset.html">Password recovery</a></p><footer><a href="index.html">Software Center</a> · Auvyrell Technologies</footer></main><script>
'use strict';
const $=id=>document.getElementById(id),form=$('form'),button=$('submit'),status=$('status');
const params=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);let token=params.get('access_token');const type=params.get('type'),error=params.get('error_code')||query.get('error_code')||params.get('error')||query.get('error');
if(location.hash||location.search)history.replaceState(null,'',location.pathname);
if(error){status.textContent=error==='otp_expired'?'This invitation is invalid, expired or already used. Ask your administrator for a fresh invitation or use password recovery.':'The invitation could not be verified. Contact your administrator.';token=null;}else if(token&&type==='invite'){$('intro').textContent='Create a password to finish setting up your Auvyrell Business account.';form.hidden=false;}else{token=null;status.textContent='An invitation link is required. Open the original invitation email rather than this page directly.';}
$('show').addEventListener('change',()=>{for(const id of ['password','confirm'])$(id).type=$('show').checked?'text':'password';});
form.addEventListener('submit',async e=>{e.preventDefault();if(!token||button.disabled)return;if($('password').value!==$('confirm').value){status.textContent='Passwords do not match.';return;}button.disabled=true;button.textContent='Activating account…';status.textContent='Contacting Auvyrell Accounts…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);try{const r=await fetch('https://ssztmguyozyihrcocowl.supabase.co/auth/v1/user',{method:'PUT',headers:{apikey:'sb_publishable_5QcNtmko7PsUwIBm_UPyKg_HT5G-REm',Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:$('password').value}),signal:controller.signal});if(!r.ok){if(r.status===401||r.status===403){token=null;form.reset();form.hidden=true;status.textContent='Your invitation session is invalid or expired. Request a new link or use password recovery.';}else if(r.status===429)status.textContent='Too many requests. Wait before trying again.';else if(r.status>=500)status.textContent='The account service is temporarily unavailable. Try again later.';else status.textContent='Password could not be saved. Check the password requirements or contact your administrator.';return;}token=null;form.reset();form.hidden=true;$('intro').textContent='Your password has been saved.';status.textContent='You can now try signing in to Auvyrell Business.';}catch(err){status.textContent=err.name==='AbortError'?'The request timed out and may still have been processed. Try signing in before retrying.':'Unable to connect to the account service. Check your connection.';}finally{clearTimeout(timer);button.disabled=false;button.textContent='Activate account';}});
</script></body></html>
